# Production / Dokploy + Traefik
#
# Usage:
#   cp .env.production.example .env
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Dokploy:
#   1. Create a Docker Compose service pointing at this file
#   2. Set Environment vars from .env.production.example
#   3. Domains tab → add domain → Service: frontend, Port: 80
#      (Dokploy injects Traefik Host/TLS labels automatically)
#   4. Redeploy after any domain change
#
# Networking:
#   - Traefik reaches only `frontend` via dokploy-network
#   - `frontend` → `backend` → `db` on private `internal` network
#   - Public path: Traefik → frontend:80 → /api proxied to backend:8080

name: dahticket-prod

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Must stay 8080 — nginx + healthcheck target this port. Not published to the host.
      PORT: "8080"
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      SLA_LOW_HOURS: ${SLA_LOW_HOURS:-48}
      SLA_MEDIUM_HOURS: ${SLA_MEDIUM_HOURS:-24}
      SLA_HIGH_HOURS: ${SLA_HIGH_HOURS:-8}
      SLA_CRITICAL_HOURS: ${SLA_CRITICAL_HOURS:-2}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@digidesks.cc}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_FORCE_PASSWORD: ${ADMIN_FORCE_PASSWORD:-false}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      SEED_LOCATIONS: ${SEED_LOCATIONS:-true}
      FRONTEND_URL: ${FRONTEND_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_FROM_ADDR: ${SMTP_FROM_ADDR:-}
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - internal
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    depends_on:
      backend:
        condition: service_healthy
    # Traefik uses expose 80; host Cloudflare Tunnel needs a published port
    expose:
      - "80"
    ports:
      - "${FRONTEND_HOST_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal
      - dokploy-network
    # When the container is on multiple networks, Traefik must use dokploy-network.
    # Host/TLS/router labels are injected by Dokploy Domains UI — do not hardcode them here.
    labels:
      - traefik.docker.network=dokploy-network
    restart: unless-stopped

networks:
  # App mesh — not attached to Traefik (only frontend joins dokploy-network)
  internal:
    driver: bridge
  # Shared with Dokploy Traefik
  dokploy-network:
    external: true

volumes:
  postgres_data:
  backend_uploads:
